spring.application.name=bmuz
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Файлы старонак маюць хэш у імені, таму іх можна трымаць у кэшы доўга.
spring.web.resources.cache.cachecontrol.max-age=365d
spring.web.resources.cache.cachecontrol.cache-public=true

# Кукі сэсіі — толькі для адміністратара: недаступны скрыптам, толькі праз HTTPS, толькі з гэтага сайта.
server.servlet.session.cookie.name=bmuz_session
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.timeout=8h

# bmuz.site-url — адрас у спасылках лістоў; бярэцца з налад, а не з запыту.
bmuz.site-url=http://localhost:5173
# bmuz.mail.from — адрас адпраўніка ў Amazon SES, напрыклад no-reply@bmuz.eu. Без яго лісты ідуць у журнал.

# Вокладкі: файл да 15 MB. Без bmuz.covers.bucket яны захоўваюцца лякальна ў тэчцы bmuz.covers.local-dir.
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=16MB
bmuz.covers.bucket=
bmuz.covers.local-dir=covers-local
